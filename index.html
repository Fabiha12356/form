<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bootstrap.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- navbaar -->
   <header id="header">
        <nav class="navbar navbar-expand-lg  d-flex">
            <div class="container" id="nav-div">
                <a class="navbar-brand" href="#"
                style="font-weight: bolder;">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end text-center" id="navbarNav">
                  <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-warning"
                  id="enrolBtn">Enrolled Student!</button>
                  </div>
            </div>
        </nav>
    </header>

 <!-- navbaar -->


 <!-- form -->

 <div id="parent" class="py-3">

  <div class="container-fluid d-flex w-75  h-auto justify-content-between " id="child">
    
    <!-- Registration Form Section -->
     <div id="form-div">
       <form id="form-valid">
             <h1 class="text-center py-4" >SignUp</h1>

             <div data-mdb-input-init class="form-outline mb-4">
                  <input type="text" id="form3Example97" name="Username" class="form-control form-control-lg" 
                  placeholder="Username"/>
                </div>

                <div data-mdb-input-init class="form-outline mb-4">
                  <input type="text" id="form3Example97" name="emailid" class="form-control form-control-lg" 
                  placeholder="Email"/>
                </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                  <input type="password" id="form3Example97" name="password" class="form-control form-control-lg" 
                  placeholder="Password"/>
                </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                  <input type="text" id="form3Example97" name="course" class="form-control form-control-lg" 
                  placeholder="Course"/>
                </div>

                   <div class="d-md-flex justify-content-start align-items-center mb-4 py-2">

                                            <h6 class="mb-0 me-4">Gender: </h6>

                                            <div class="form-check form-check-inline mb-0 me-4">
                                                <input class="form-check-input" type="radio" name="gender"
                                                    id="femaleGender" value="female" />
                                                <label class="form-check-label" for="femaleGender">Female</label>
                                            </div>

                                            <div class="form-check form-check-inline mb-0 me-4">
                                                <input class="form-check-input" type="radio" name="gender"
                                                    id="maleGender" value="male" />
                                                <label class="form-check-label" for="maleGender">Male</label>
                                            </div>
                                        </div>
                 
       <div class="d-flex justify-content-center">
       <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-warning btn-lg ms-2">Submit!</button>
        </div>
       
                
       </form>
                </div>

    <!-- Side Panel Linking to Login -->
    <div id="next-div" class="my-1">
      <h1>Welcome Back!</h1>
      <p>Already have an account?</p>
        <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-warning btn-lg ms-2"
       style="border: 2px solid white !important;
       padding: 10px 5px !important;
       width: 35% !important;"
       id="loginbtn">LogIn</button>
    </div>

  </div>
</div>




<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./bootstrap.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
</body>
</html>
